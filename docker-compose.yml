# Semua "kotak" yang dibutuhkan aplikasi. Nyalakan dengan: make up
# Nama database dan passwordnya dibaca dari file .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD).
services:

  # Aplikasi Laravel (PHP-FPM). Kode di folder ini dipasang ke /var/www di dalam kotak.
  app:
    build: ./docker/app
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy

  # Web server: buka http://localhost:8000 di browser
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Database. Datanya disimpan di volume "mysql-data" agar tidak hilang saat make down.
  # Port sengaja tidak dibuka ke luar supaya tidak bentrok dengan MySQL lain di laptopmu.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Node hanya dipakai untuk membangun aset CSS/JS (make build).
  # Tidak ikut menyala saat make up.
  # Berjalan sebagai user "node" (id 1000), bukan root, supaya file hasilnya
  # (node_modules, public/build) tetap bisa kamu ubah dan hapus, terutama di Windows/WSL.
  node:
    image: node:22-alpine
    user: node
    profiles: ["tools"]
    working_dir: /var/www
    volumes:
      - ./:/var/www

volumes:
  mysql-data:
