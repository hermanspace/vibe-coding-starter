# Pintu masuk: nginx menerima kunjungan lalu meneruskannya ke PHP (kotak "app").
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    # File statis (CSS, JS, gambar) dilayani langsung
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File PHP diteruskan ke kotak "app" di port 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Jangan tampilkan file tersembunyi
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
